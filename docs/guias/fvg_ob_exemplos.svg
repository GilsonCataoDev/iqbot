<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <style>
    .bg{fill:#09111f}.panel{fill:#111d31;stroke:#30445f;stroke-width:2}.grid{stroke:#263852;stroke-width:1}.t{font-family:Arial,sans-serif;fill:#e4eefc}.h{font:700 27px Arial,sans-serif;fill:#38bdf8}.l{font:600 18px Arial,sans-serif;fill:#e4eefc}.s{font:16px Arial,sans-serif;fill:#a9bbd2}.green{fill:#35c8a5}.red{fill:#f26b63}.wickg{stroke:#35c8a5;stroke-width:4}.wickr{stroke:#f26b63;stroke-width:4}.arrow{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
  <rect class="bg" width="1400" height="760"/>
  <text x="58" y="55" class="t" style="font:700 34px Arial">FVG e OB — exemplos de confluência</text>
  <text x="58" y="84" class="s">A zona aponta onde observar. A entrada só existe após confirmação da vela.</text>
  <rect class="panel" x="45" y="115" width="635" height="495" rx="12"/>
  <rect class="panel" x="720" y="115" width="635" height="495" rx="12"/>
  <text x="75" y="160" class="h">FVG — GAP DE VALOR</text><text x="75" y="190" class="s">Movimento forte deixa uma faixa sem negociação equilibrada.</text>
  <text x="750" y="160" class="h">OB — ORDER BLOCK</text><text x="750" y="190" class="s">Última vela contrária antes de um deslocamento forte.</text>
  <g class="grid"><path d="M70 270H650M70 360H650M70 450H650M745 270H1330M745 360H1330M745 450H1330"/></g>
  <!-- FVG left: candle 1, displacement, candle 3 -->
  <line x1="155" y1="420" x2="155" y2="320" class="wickr"/><rect x="138" y="350" width="34" height="52" class="red"/>
  <line x1="270" y1="410" x2="270" y2="225" class="wickg"/><rect x="253" y="250" width="34" height="135" class="green"/>
  <line x1="385" y1="275" x2="385" y2="230" class="wickg"/><rect x="368" y="238" width="34" height="28" class="green"/>
  <rect x="185" y="285" width="165" height="55" fill="#22c7b8" opacity=".25" stroke="#35c8a5" stroke-width="2"/>
  <text x="225" y="318" class="l" fill="#35c8a5">FVG</text>
  <path d="M430 245 C505 265 500 330 445 340" class="arrow"/>
  <line x1="445" y1="380" x2="445" y2="315" class="wickg"/><rect x="428" y="340" width="34" height="38" class="green"/>
  <text x="410" y="410" class="l">confirmação</text>
  <path d="M480 350 C535 325 555 275 565 245" class="arrow"/>
  <line x1="575" y1="275" x2="575" y2="210" class="wickg"/><rect x="558" y="225" width="34" height="45" class="green"/>
  <text x="90" y="520" class="s">Leitura: impulso forte → preço volta ao FVG →</text><text x="90" y="548" class="s">rejeição/engolfo M5 na direção do impulso.</text>
  <!-- OB right -->
  <line x1="835" y1="405" x2="835" y2="335" class="wickr"/><rect x="818" y="350" width="34" height="42" class="red"/>
  <rect x="795" y="330" width="80" height="84" fill="#38bdf8" opacity=".20" stroke="#38bdf8" stroke-width="2"/>
  <text x="782" y="440" class="l">OB comprador</text>
  <line x1="950" y1="390" x2="950" y2="220" class="wickg"/><rect x="933" y="245" width="34" height="125" class="green"/>
  <line x1="1015" y1="280" x2="1015" y2="205" class="wickg"/><rect x="998" y="220" width="34" height="55" class="green"/>
  <path d="M1050 235 C1140 260 1135 365 1085 370" class="arrow"/>
  <line x1="1085" y1="420" x2="1085" y2="345" class="wickg"/><rect x="1068" y="370" width="34" height="42" class="green"/>
  <text x="1045" y="450" class="l">confirmação</text>
  <path d="M1120 380 C1180 350 1210 285 1230 240" class="arrow"/>
  <line x1="1240" y1="275" x2="1240" y2="205" class="wickg"/><rect x="1223" y="220" width="34" height="48" class="green"/>
  <text x="765" y="520" class="s">Leitura: OB cria o ponto de interesse → retorno →</text><text x="765" y="548" class="s">vela compradora confirma que a zona foi defendida.</text>
  <rect x="45" y="640" width="1310" height="76" rx="10" fill="#0d192b" stroke="#30445f"/>
  <text x="95" y="685" class="l">1. Impulso</text><path d="M265 678H340" class="arrow"/>
  <text x="365" y="685" class="l">2. Zona</text><path d="M500 678H575" class="arrow"/>
  <text x="600" y="685" class="l">3. Retorno</text><path d="M770 678H845" class="arrow"/>
  <text x="870" y="685" class="l">4. Confirmação</text>
  <text x="1115" y="685" style="font:700 17px Arial;fill:#fbbf24">Zona não é entrada sozinha</text>
</svg>
